# Public repositories cannot call private reusable workflows.
# The local reporter preserves the verified upstream revision and legacy opt-in.

name: Report Change to Plane

on:
  pull_request:
    types: [opened, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  report:
    # Preserve the upstream opt-in for the legacy Plane reporter during the GCP transition.
    uses: ./.github/workflows/gmud-legacy.yml
    secrets:
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
