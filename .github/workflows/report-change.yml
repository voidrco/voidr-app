# Copy this file to .github/workflows/report-change.yml in each service repo.
# No changes needed — all logic lives in github-action-workflows.

name: Report Change to Plane

on:
  pull_request:
    types: [opened, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  report:
    # Preserve the upstream opt-in for the legacy Plane reporter during the GCP transition.
    uses: voidrco/github-action-workflows/.github/workflows/change-management.yml@510d724a5cfd717ab1bf5eea151c17a8a7403375
    secrets:
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
