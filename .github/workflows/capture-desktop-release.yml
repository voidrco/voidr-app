name: Capture Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'capture-v*'

permissions:
  contents: read

concurrency:
  group: capture-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        channel: [staging, production]
    env:
      VITE_VOIDR_CAPTURE_CHANNEL: ${{ matrix.channel }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "capture-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CAPTURE_RELEASE_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci
      - run: npm run capture:typecheck
      - name: Install Chromium for journey checks
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:capture
      - run: node desktop/scripts/make-signed.mjs

      - name: Verify signed and notarized artifacts
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find desktop/out -type d -name 'Voidr.app' -print -quit)"
          dmg_path="$(find desktop/out/make -type f -name '*.dmg' -print -quit)"
          test -n "${app_path}"
          test -n "${dmg_path}"

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Prepare private-bucket release bundle
        run: node desktop/scripts/prepare-release.mjs --platform=mac --arch=arm64 --channel=${{ matrix.channel }}

      - uses: actions/upload-artifact@v4
        with:
          name: voidr-capture-macos-arm64-${{ matrix.channel }}-signed
          path: desktop/out/release/capture/**
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "capture-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run capture:typecheck
      - name: Install Chromium for journey checks
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:capture
      - run: npm run make --workspace @voidr/capture-desktop -- --arch=x64
      - run: node desktop/scripts/prepare-release.mjs --platform=windows --arch=x64

      - uses: actions/upload-artifact@v4
        with:
          name: voidr-capture-windows-x64
          path: desktop/out/release/capture/**
          if-no-files-found: error
          retention-days: 14
